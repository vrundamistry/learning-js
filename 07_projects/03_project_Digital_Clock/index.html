    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css" />

    <div class="clock-container">
      <h1>Digital Clock</h1>

      <div class="clock">
        <span id="hours">00</span>
        <span class="colon">:</span>
        <span id="minutes">00</span>

    </div>

    <div id="clock"></div>
