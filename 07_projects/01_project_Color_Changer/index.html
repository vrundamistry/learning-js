<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Color Changer</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <nav>
      <a href="/" aria-current="page">Home</a>
      <!-- <a href="/page2.html">Other page</a> -->
    </nav>
    <div class="container">
      <h1>Color Changer</h1>
      <p>Click the buttons to change the background color.</p>

      <div class="buttons">
        <button class="color-btn" data-color="#ff6b6b">Red</button>
        <button class="color-btn" data-color="#feca57">Yellow</button>
        <button class="color-btn" data-color="#48dbfb">Blue</button>
        <button class="color-btn" data-color="#1dd1a1">Green</button>
        <button class="color-btn" data-color="#5f27cd">Purple</button>
        <button class="color-btn" data-color="#ffffff">White</button>
      </div>

      <p id="color-name">Current color: Default</p>
    </div>
  </body>
  <script type="module" src="color-changer.js"></script>
</html>
