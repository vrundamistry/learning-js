<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0 20px;
        }
        .card-wrapper{
            width: 400px;
            height: auto;
            border: 1px solid #ccc;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
            box-shadow: outset 0px 3px 10px 0 #ccc;
        }
        .card-wrapper img{
            width: 100px;
            height: 100px;
            border-radius: 100px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body style="background-color: #212121; color: #fff;">
    0	UNSENT	Client has been created. open() not called yet.
    1	OPENED	open() has been called.
    2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
    3	LOADING	Downloading; responseText holds partial data.
    4	DONE	The operation is complete.
</body>
<script>

    let div = document.createElement('div')
    div.classList.add('card-wrapper')
    document.body.appendChild(div)


    const requestUrl = 'https://api.github.com/users/vrundamistry';

    const xhr = new XMLHttpRequest()
    xhr.open('GET', requestUrl)
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState)
        if (xhr.readyState == 4) {
            const data = JSON.parse(this.responseText)
            console.log(typeof data)
            console.log(data.followers)

            div.innerHTML = `
                    <img src="${data.avatar_url}" class="profile-img">
                    <div>Followers: <strong>${data.followers}</strong></div>
                `

            }
    }
    xhr.send()


    
    
</script>
</html>
